name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Server boots
        run: |
          PORT=4100 node server/index.ts &
          for i in $(seq 1 20); do curl -fs localhost:4100/healthz && exit 0; sleep 0.5; done
          exit 1
